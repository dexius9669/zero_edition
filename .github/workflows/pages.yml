name: Publish Champions of ZED
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate website from source Markdown
        run: python scripts/convert.py
      - name: Check source and conversion
        run: python -m unittest discover -s tests -v
      - name: Build static HTML
        run: mkdocs build --strict
      - name: Verify that Pages contains the book, not README
        run: |
          test -s site/index.html
          test -s site/chapters/introduction/index.html
          grep -q 'coz-title' site/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
